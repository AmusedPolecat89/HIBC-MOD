[workspace]
members = [
  ".",
  "bindings/python/hibc_mod_py",
]
resolver = "2"

[package]
name = "hibc-mod"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
memmap2 = "0.9.4"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
leb128 = "0.2.5"
log = "0.4"
env_logger = "0.11"
hnsw_rs = "0.2.0"
rand = "0.8.5"
bytemuck = { version = "1.15", features = ["derive", "extern_crate_std"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.10"
